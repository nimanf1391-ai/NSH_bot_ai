.app{background:transparent;position:relative;z-index:1}

.bot{box-shadow:0 8px 24px -16px rgba(16,26,51,.6)}

.spt{width:170px}.spt i{animation:gr 3.2s cubic-bezier(.4,0,.2,1) forwards}

<script>
const $=i=>document.getElementById(i);
const log=$('log'),inp=$('in');
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const sup=e=>String(e).replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
const dig=s=>s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const fmt=n=>'<span class="num">'+n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')+'</span>';
const row=(l,v)=>'<div><span>'+l+'</span><b>'+v+'</b></div>';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function add(html,cls,text){const d=document.createElement('div');d.className='m '+cls;if(text!==undefined)d.textContent=text;else d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function say(html,delay=350){const t=add('<span class="dots"><span></span><span></span><span></span></span>','bot t');return new Promise(r=>setTimeout(()=>{t.className='m bot';t.innerHTML=html;log.scrollTop=log.scrollHeight;r()},delay))}

/* ---------- math ---------- */
const SM=[2n,3n,5n,7n,11n,13n,17n,19n,23n,29n,31n,37n],DET=3317044064679887385961981n;
const mod=(b,e,m)=>{let r=1n;b%=m;while(e>0n){if(e&1n)r=r*b%m;b=b*b%m;e>>=1n}return r};
function isPrime(n){
  if(n<2n)return false;
  for(const p of SM){if(n===p)return true;if(n%p===0n)return false}
  let d=n-1n,s=0;while(d%2n===0n){d/=2n;s++}
  for(const a of SM){let x=mod(a,d,n);if(x===1n||x===n-1n)continue;let ok=false;
    for(let i=1;i<s;i++){x=x*x%n;if(x===n-1n){ok=true;break}}if(!ok)return false}
  return true}
const gcd=(a,b)=>{while(b){[a,b]=[b,a%b]}return a};
function rho(n,dead){
  if(n%2n===0n)return 2n;
  for(let c=1n;c<40n;c++){let x=2n,y=2n,d=1n,i=0;
    while(d===1n){x=(x*x+c)%n;y=(y*y+c)%n;y=(y*y+c)%n;d=gcd(x>y?x-y:y-x,n);if((++i&1023)===0&&Date.now()>dead)return null}
    if(d!==n)return d}
  return null}
function factorize(n){
  const f=new Map(),add=p=>f.set(p,(f.get(p)||0n)+1n),unf=[];
  for(let p=2n;p<2000n&&p*p<=n;p+=(p===2n?1n:2n)){while(n%p===0n){add(p);n/=p}}
  const dead=Date.now()+3000,st=[n];
  while(st.length){const x=st.pop();if(x===1n)continue;if(isPrime(x)){add(x);continue}
    const d=rho(x,dead);if(!d){unf.push(x);continue}st.push(d,x/d)}
  return{f,unf}}
const nextPrime=n=>{let k=n+1n;while(!isPrime(k))k++;return k};
const prevPrime=n=>{let k=n-1n;while(k>=2n&&!isPrime(k))k--;return k>=2n?k:null};
const isqrt=n=>{if(n<2n)return n;let x=1n<<BigInt((n.toString(2).length+1)>>1);for(;;){const y=(x+n/x)>>1n;if(y>=x)return x;x=y}};
let SV=null;const SL=2000000;
function sieve(){if(SV)return SV;SV=new Uint8Array(SL+1);SV[0]=SV[1]=1;for(let i=2;i*i<=SL;i++)if(!SV[i])for(let j=i*i;j<=SL;j+=i)SV[j]=1;return SV}
function twoSquares(p){const s=Number(p);for(let a=1;a*a<=s/2;a++){const b2=s-a*a,b=Math.round(Math.sqrt(b2));if(b*b===b2)return[a,b]}return null}

/* ---------- analysis ---------- */
function analyze(n){
  let pre='';
  if(n<0n){pre='<div class="cap">اعداد اول و مرکب مثبت‌اند؛ قدر مطلق عدد را بررسی کردم.</div>';n=-n}
  if(n<2n){
    return '<div class="vd z"><div class="vn">'+fmt(n)+'</div><div class="vt">نه اول، نه مرکب</div></div>'+
    '<div class="cap">'+(n===0n?'صفر را بر هر عددی می‌شود تقسیم کرد؛ برای همین در هیچ‌کدام از این دو دسته نیست.':'عدد ۱ فقط یک مقسوم‌علیه دارد (خودش)، پس نه اول است نه مرکب.')+'</div>'}
  const prime=isPrime(n),big=n>DET;
  let h=pre+'<div class="vd '+(prime?'p':'c')+'"><div class="vn">'+fmt(n)+'</div><div class="vt">'+(prime?(big?'احتمالاً اول':'اول است ✓'):'مرکب است')+'</div></div>';
  const R=[];
  if(prime){
    R.push(row('دلیل','فقط بر ۱ و خودش بخش‌پذیر است'));
    const p=prevPrime(n),q=nextPrime(n);
    R.push(row('اول قبلی',p?fmt(p):'ندارد'));
    R.push(row('اول بعدی',fmt(q)));
  }else{
    const{f,unf}=factorize(n);
    const keys=[...f.keys()].sort((a,b)=>a<b?-1:1);
    let t='<div class="tags">';
    keys.forEach((p,i)=>{t+=(i?'<span>×</span>':'')+'<span class="tag"><span class="num">'+p+(f.get(p)>1n?sup(f.get(p)):'')+'</span></span>'});
    unf.forEach(u=>{t+='<span>×</span><span class="tag"><span class="num">'+u+'</span>؟</span>'});
    h+='<div class="cap">تجزیه به عامل‌های اول</div>'+t+'</div>';
    if(unf.length)R.push(row('توجه','بخشی از عدد در زمان مجاز تجزیه نشد (علامت ؟)'));
    else{
      let dc=1n;f.forEach(e=>{dc*=e+1n});
      R.push(row('تعداد مقسوم‌علیه‌ها',fa(dc)));
      if(dc<=48n){let ds=[1n];f.forEach((e,p)=>{const nd=[];for(const d of ds){let m=1n;for(let i=0n;i<=e;i++){nd.push(d*m);m*=p}}ds=nd});
        ds.sort((a,b)=>a<b?-1:1);R.push(row('مقسوم‌علیه‌ها','<span class="num">'+ds.join('، ')+'</span>'))}
    }
    R.push(row('کوچک‌ترین مقسوم‌علیه اول','<span class="num">'+(keys[0]||'؟')+'</span>'));
    const r=isqrt(n);if(r*r===n)R.push(row('مربع کامل',fmt(r)+'²'));
  }
  const dv=[];if(n%2n===0n)dv.push('۲');if(n%3n===0n)dv.push('۳');if(n%5n===0n)dv.push('۵');
  R.push(row('بخش‌پذیر بر',dv.length?dv.join('، '):'نه ۲، نه ۳، نه ۵'));
  R.push(row('زوج یا فرد',n%2n===0n?'زوج':'فرد'));
  const ds=n.toString().split('').reduce((a,c)=>a+ +c,0);
  R.push(row('مجموع ارقام',fa(ds)+(ds%3===0?' (پس بر ۳ بخش‌پذیر است)':'')));
  h+='<div class="fx">'+R.join('')+'</div>';
  if(n<10n**15n){let s='<div class="strip">';for(let k=-4;k<=4;k++){const m=n+BigInt(k);s+='<i class="'+(m>=2n&&isPrime(m)?'p':'')+(k===0?' on':'')+'">'+(m<0n?'·':m)+'</i>'}
    h+=s+'</div><div class="cap">عددهای کنار آن: خانهٔ زرد یعنی اول</div>'}
  return h}

/* ---------- chat ---------- */
const SALT='NSH.made-'+[1,3,9,1].join('');
const hs=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h};
const sig=b=>String(hs(SALT+'|'+b));
let lastN=null,mode='chat',cur=null,score=0,streak=0,best=(()=>{const b=+(ls.get('nsh-best')||0);return ls.get('nsh-sig')===sig(b)?b:0})();
$('bs').textContent=fa(best);
let tmo=null;
const bars=m=>{mode=m;$('f').hidden=m!=='chat';$('ask').hidden=m!=='ask';$('nx').hidden=m!=='next';const tm=$('tm');tm.hidden=m!=='ask';clearTimeout(tmo);if(m==='ask'){const i=tm.firstChild;i.style.animation='none';void i.offsetWidth;i.style.animation='';tmo=setTimeout(()=>answer(null),20000)}};
async function run(n){lastN=n<0n?-n:n;await say(analyze(n),300+Math.min(n.toString().length*25,700))}
async function handle0(raw){
  const t=dig(raw).replace(/[,،٬\s]/g,'').replace(/\*\*/g,'^'),w=dig(raw);let m;
  if(/^[+-]?\d+$/.test(t)){await run(BigInt(t))}
  else if(await extra(w)){}
  else if(m=t.match(/^(\d+)\^(\d+)([+-]\d+)?$/)){
    const e=BigInt(m[2]);if(e>1200n||BigInt(m[1])>10n**6n){return say('این عبارت زیادی بزرگ است. توان را تا ۱۲۰۰ و پایه را تا یک میلیون نگه دار.')}
    const v=BigInt(m[1])**e+BigInt(m[3]||0);if(v.toString().length>320)return say('نتیجه بیشتر از ۳۲۰ رقم می‌شود؛ کوچک‌ترش کن.');
    await say('مقدار عبارت: '+fmt(v),200);await run(v)}
  else if(m=w.match(/(ب\.?م\.?م|ک\.?م\.?م|gcd|lcm)\D*?(\d+)\D+(\d+)/i)){const a=BigInt(m[2]),b=BigInt(m[3]);if(!a||!b)return say('هر دو عدد باید بزرگ‌تر از صفر باشند.');const g=gcd(a,b);await say('ب.م.م('+fmt(a)+'، '+fmt(b)+') = <b>'+fmt(g)+'</b>\nک.م.م = <b>'+fmt(a/g*b)+'</b>'+(g===1n?'\nاین دو عدد نسبت به هم اول‌اند.':''))}
  else if(/مثلثات|trig/i.test(w)){await say(trigRules(),300)}
  else if(m=w.match(TRIGRE)){await say(trigCard(TRIGMAP[m[1].toLowerCase()],parseFloat(m[2])),250)}
  else if(/مثلث|triangle/i.test(w)&&/\d/.test(w)){const ns=(w.match(/\d+(?:\.\d+)?/g)||[]).map(Number);const h=(ns.length===2||ns.length===3)?triCard(ns):null;if(!h&&ns.length<2)need=w;await say(h||'برای حل مثلث، <b>دو ضلع قائم</b> یا <b>سه ضلع</b> را بنویس.\nمثال: <span class="num">مثلث 3 4</span> یا <span class="num">مثلث 5 6 7</span>',250)}
  else if(/^\s*تحلیل\s*$/.test(w)){if(lastN===null)return say('اول یک عدد بفرست.');await run(lastN)}
  else if((m=mathNorm(w))){try{const{r,approx}=calc(m);await say(mathCard(m,r,approx),300)}catch(e){await say('<span class="bad">'+(e&&e.fa?e.fa:'این محاسبه را نتوانستم انجام دهم.')+'</span>\nمثال: <span class="num">12×(3+4)</span> یا <span class="num">100÷8</span>',200)}}

    const t=add('<span class="dots"><span></span><span></span><span></span></span>','bot t');
    const prompt='تو NSH.bot هستی، دستیار ریاضی پایهٔ هشتم (هندسه، جبر، اعداد اول، مثلثات). اگر شکل هندسی هست، زاویه‌ها و ضلع‌ها را با قاعده‌های هندسهٔ هشتم حساب کن. این عکس را بررسی کن و به فارسی ساده و در حد دانش‌آموز پاسخ بده. اگر در عکس مسئلهٔ ریاضی، عدد، مثلث یا نمودار هست، آن را بخوان و مرحله‌به‌مرحله حل کن (در مثلثات از نسبت‌های مثلثاتی و قانون سینوس‌ها و کسینوس‌ها کمک بگیر). اگر عدد صحیحی دیده می‌شود، بگو اول است یا مرکب و تجزیه‌اش را بنویس. اگر عکس ربطی به ریاضی ندارد، کوتاه بگو چه می‌بینی و بپرس چه کمکی می‌خواهد. پاسخ را کوتاه نگه دار و فقط متن ساده بنویس، بدون مارک‌داون و بدون HTML.'+(q?'\nسؤال کاربر دربارهٔ عکس: '+q:'');
    try{
      await sample(prompt,{images:[f],modelTier:'default',cache:false,onText:({text})=>{t.className='m bot ai';t.textContent=text;log.scrollTop=log.scrollHeight}});
    }catch(e){
      if(e&&e.text){t.className='m bot ai';t.textContent=e.text}
      else{t.className='m bot';t.textContent=(e&&MSG[e.code])||'تحلیل عکس انجام نشد؛ دوباره امتحان کن.'}
    }finally{busy=false;log.scrollTop=log.scrollHeight}
  };
})();

 if(m){const k=m[1].trim(),v=m[2].trim();if(!tk(k).length)return null;const a=KB.get().filter(e=>nz(e.k)!==nz(k));a.push({k,v});KB.set(a);return pick(['باشه، یاد گرفتم! 🧠','ثبت شد! 📝','عالی، دیگر فراموش نمی‌کنم 💡'])+box(k,v)+'هر وقت دربارهٔ «'+esc(k)+'» بپرسی، همین را می‌گویم.'}
 const n=t.match(/^(?:یادت باشه|یادت باشد|یادداشت کن|به خاطر بسپار)(?: که)?\s*[:：]?\s*(.{3,})$/);if(n){const a=KB.get();a.push({k:'یادداشت',v:n[1].trim(),note:1});KB.set(a);return 'یادداشت شد 📝 «'+esc(n[1].trim())+'». هر وقت بنویسی «چی یادته» نشانت می‌دهم.'}return null}
function recall(r){if(/\d/.test(r))return null;const Q=tk(r);if(!Q.length)return null;let best=null,bs=0;for(const e of KB.get()){if(e.note)continue;const K=tk(e.k);if(K.length&&K.every(w=>Q.includes(w))&&Q.length<=K.length+4&&K.length>=bs){best=e;bs=K.length}}
 return best?pick(['طبق چیزی که خودت یادم دادی 🧠','یادم هست! 😊','تو این را به من یاد دادی:'])+box(best.k,best.v):null}
const RD=[['۳ نفر ۳ سیب را در ۳ دقیقه می‌خورند. ۹ نفر ۹ سیب را در چند دقیقه می‌خورند؟',3,'هر نفر در ۳ دقیقه یک سیب می‌خورد.'],['عددی را در ۳ ضرب کردم و ۴ تا جمع کردم، شد ۲۲. عدد چند بود؟',6,'معادلهٔ 3x+4=22 را حل کن.'],['اگر امروز شنبه (روز ۱) باشد، ۱۰ روز دیگر روز چندم هفته است؟',4,'۱۰ تقسیم بر ۷ باقی‌مانده ۳ دارد؛ ۱+۳.'],['مجموع عددهای ۱ تا ۱۰ چند است؟',55,'گاوس: ۵ جفت ۱۱ تایی.'],['یک ۱۰‌ضلعی چند قطر دارد؟',35,'n(n−3)/2.']];
const TALK=[[/^(?:سلام|درود|های|hi|hello|سلام علیکم)(?: .*)?$/i,['سلام {n}! 😊 خوشحالم دوباره می‌بینمت. حالت چطوره؟','درود {n}! 🌟 امروز چه خبر؟ حال و هوایت چطور است؟','سلام {n}، خوش آمدی! ☀️ برای یاد گرفتن آماده‌ای یا اول کمی گپ بزنیم؟']],
[/^(?:خوبم|خوب|عالیم|عالی ام|بد نیستم|بدک نیستم|مرسی خوبم|منم خوبم)$/,['خوشحالم! 😊 با این حال خوب بیا چیز جدیدی یاد بگیریم: هندسه، جبر یا فیزیک؟ یا یک تمرین سبک؟','عالیه! 🎉 پس انرژی داری. بگو چه چیزی را شروع کنیم؟']],
[/حالم بد|^بدم|افتضاح|خیلی بد|حال ندارم/,['متأسفم که حالت خوب نیست 💙 اگر دوست داری بگو چه شده؛ من گوش می‌دهم. اگر نخواستی حرف بزنی، با یک تمرین خیلی آسان ذهنت را عوض کنیم؟']],
[/دوستت دارم|عاشقتم/,['ممنون، خیلی لطف داری 😊 من از کمک‌کردن به تو لذت می‌برم؛ ولی یادت باشد دوست‌ها و خانواده‌ات هم کنارت باشند 💙']],
[/باحالی|هوشمندی|خیلی خوبی|عالی بود|دمت گرم|آفرین/,['وای مرسی! 😄 تو هم عالی هستی. بیا ادامه بدهیم؟','لطف داری {n}! 🌟 من فقط کمک می‌کنم، تلاش اصلی با خودت است.']],

[/حوصله.{0,3}(?:ام)? ?سر رفته|حوصلم سر|بی ?حوصله|کسل/,['بیا حوصله‌ات را سر بیاوریم! 😄 بنویس «معما»، «جوک ریاضی» یا «تمرین ساده».']],
[/^(?:بازی|سرگرمم کن|بازی کنیم)/,['بازی؟ عالیه! 🎮 «چالش» (اول یا مرکب)، «معما» یا «تمرین ساده» — کدام را می‌خواهی؟']],

[/^(?:ببخشید|معذرت|ببخشید که)/,['اصلاً مهم نیست 😊 بگو، چه کمکی می‌خواهی؟']],
[/نمیدونم|نمی دونم|نمیدونم/,['اشکالی ندارد! 🌱 از ساده شروع کن: بگو مسئله چه چیزی را می‌خواهد و چه چیزهایی داده، با هم قدم‌به‌قدم جلو می‌رویم.']],
[/^(?:فهمیدم|آها|اهان|متوجه شدم|فهمیدم ممنون)$/,['آفرین! 👏 بیا ببینم واقعاً جا افتاده؛ بنویس «تمرین ساده» تا امتحان کنیم.']],
[/^(?:خب|خوب|باشه|اوکی|ok|حله)$/,['خب 😊 چه چیزی را شروع کنیم؟ «هندسه»، «جبر»، «فیزیک» یا «تمرین ساده»؟']]];
window.mind=function(raw){const t=raw.trim(),z=nz(t);if(!z||/^[\d\s.,٫،۰-۹٠-٩+\-×÷*/^=()]+$/.test(t))return null;
 const te=teach(t);if(te)return te;
 let m=t.match(/^فراموش کن[:：]?\s*(.+)$/);if(m){const q=tk(m[1]);if(/^(?:همه|همه چیز|همه را)$/.test(nz(m[1])))return 'مطمئنی؟ اگر بله، بنویس «بله، همه را پاک کن».';const a=KB.get(),b=a.filter(e=>!(q.length&&tk(e.k).join(' ')===q.join(' ')));KB.set(b);return a.length===b.length?'چیزی با این نام در حافظه‌ام پیدا نکردم 🤔':'فراموش شد 🗑️'}
 if(/بله.*همه را پاک کن/.test(z)){KB.set([]);return 'حافظه پاک شد 🧹 از اول یاد می‌گیریم.'}
 if(/(?:چی|چه)(?:ا)? ?(?:یاد گرفتی|یادته|یاد داری)|یادداشت ?هام|یادگیری ?هام|حافظه ?ات/.test(z)){const a=KB.get();return a.length?'<b>🧠 حافظهٔ من ('+a.length+' مورد)</b>'+a.map((e,i)=>'<div class="cap">'+(i+1)+') '+(e.note?'📝 ':'')+esc(e.note?e.v:e.k+' ← '+e.v)+'</div>').join('')+'<div class="cap">برای پاک‌کردن: «فراموش کن: عنوان»</div>':'هنوز چیزی به من یاد نداده‌ای 🙂 بنویس: «یاد بگیر: مساحت دایره = πr²»'}
 const rc=recall(t);if(rc)return rc;
 if(/معما|پازل/.test(z)&&z.length<25){const q=pick(RD);window.QZ={a:q[1],h:q[2],n:0};return '<b>🧩 معما:</b> '+q[0]+'<div class="cap">جواب را فقط به‌صورت عدد بفرست؛ «راهنمایی» هم بنویسی کمک می‌کنم.</div>'}
 if(z.length<40&&/^(?:آره|اره|بله|حتما|حتماً|بزن بریم|بریم|آماده ام|اماده ام)$/.test(z)){if(window.QZ)return 'اول جواب تمرین بالا را بفرست، یا «راهنمایی» بنویس 😊';const lb=lastBot();if(/تمرین|امتحان|چالش/.test(lb))return window.chat('تمرین ساده');if(/جوک/.test(lb))return window.chat('جوک');return 'عالی! 🎉 شروع کنیم؛ بنویس «هندسه»، «جبر»، «فیزیک» یا «تمرین ساده».'}
 if(/^(?:نه|نخیر|نمیخوام|نمی خوام|بعدا|فعلا نه)$/.test(z))return pick(['باشه، هر وقت خواستی اینجا هستم 😊','حله! عجله‌ای نیست 🌿 هر وقت آماده شدی بگو.']);
 if(window.LT&&z.length<32&&!/تمرین/.test(z)){if(/مثال/.test(z))return '📌 مثال دیگر دربارهٔ «'+window.LT[0]+'»:<div class="fx" style="display:block">'+window.LT[4]+'</div>اگر خواستی بنویس «تمرین ساده» تا امتحان کنیم.';if(/بیشتر|نفهمیدم|گنگ|دوباره|ساده ?تر|چرا|یعنی چی|یعنی چه/.test(z))return 'باشه، ساده‌تر و قدم‌به‌قدم می‌گویم 🙂<br>'+expl(window.LT)}
 if(z.length<46)for(const e of TALK)if(e[0].test(z))return N(pick(e[1]));

window.unknownReply=function(raw){const Q=tk(raw);let best=null,bs=0;for(const o of T){const hay=tk(o[0]+' '+o[1].replace(/\|/g,' ')+' '+o[3].replace(/[~:]+/g,' '));const sc=Q.filter(w=>w.length>2&&hay.some(h=>h===w||(h.length>3&&(h.includes(w)||w.includes(h))))).length;if(sc>bs){bs=sc;best=o}}

 return pick(['هنوز این را متوجه نمی‌شوم 🤔 ولی دوست دارم یاد بگیرم! اگر جوابش را می‌دانی بنویس: «یاد بگیر: سؤال = جواب» تا همیشه یادم بماند. اگر مبحث درسی است، اسمش را بنویس؛ مثلاً «فیثاغورس».','این یکی را بلد نیستم 😅 ولی تو می‌توانی یادم بدهی: «یاد بگیر: … = …». یا بنویس «هندسه»، «جبر»، «فیزیک» تا از مبحث‌های آماده شروع کنیم.','کمی گیج شدم 🤯 می‌شود دقیق‌تر بگویی؟ مثلاً اسم مبحث یا یک مسئلهٔ عددی بنویس.'])}})();
